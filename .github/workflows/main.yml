name: Run Tests and Send Email

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run smoke test
        run: npm run test:smoke | tee smoke_test.log

      - name: Start web server
        run: npm run web &
        
      - name: Wait for web server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8081 > /dev/null; then
              echo "Web server is ready"
              exit 0
            fi
            echo "Waiting for web server... ($i/30)"
            sleep 2
          done
          exit 1

      - name: Run UI test
        run: npm run test:ui | tee ui_test.log

      - name: Prepare combined log
        run: cat smoke_test.log ui_test.log > test_results.log

      - name: Send email with results
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          username: ${{ secrets.OUTLOOK_USERNAME }}
          password: ${{ secrets.OUTLOOK_PASSWORD }}
          subject: "Daily Log - Test Results"
          to: hoangvu96z@gmail.com
          from: GitHub Actions <hoangvu96z@hotmail.com>
          body: |
            Smoke test and UI test have completed.
            See attached log file for details.
          attachments: test_results.log
